<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Register</h1>
    <p class="subtitle">Create a new account.</p>

    <p id="form-message" class="message"></p>

    <form id="register-form" novalidate>
      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Your name">
        <p id="name-error" class="error"></p>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com">
        <p id="email-error" class="error"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters">
        <p id="password-error" class="error"></p>
      </div>

      <div class="field">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" placeholder="Repeat your password">
        <p id="confirm-error" class="error"></p>
      </div>

      <button type="submit">Register</button>
    </form>

    <p class="switch">Already have an account? <a href="index.html">Login</a></p>
  </div>

  <script src="storage.js"></script>
  <script src="register.js"></script>
</body>
</html>
