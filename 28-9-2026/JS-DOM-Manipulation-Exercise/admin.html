<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card wide">
    <div class="top-bar">
      <h1>Admin Dashboard</h1>
      <div>
        <a href="dashboard.html" class="checklist-link">Mission Checklist</a>
        <button id="logout-btn" class="logout-btn">Logout</button>
      </div>
    </div>

    <p class="subtitle" id="admin-info"></p>
    <p class="subtitle" id="users-count"></p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
          </tr>
        </thead>
        <tbody id="users-table"></tbody>
      </table>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="admin.js"></script>
</body>
</html>
